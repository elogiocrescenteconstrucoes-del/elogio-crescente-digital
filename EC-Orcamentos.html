<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EC Orçamentos PRO</title><style>body{background:#101114;color:#eee;font:16px system-ui;max-width:850px;margin:auto;padding:20px}h1,h2,strong{color:#d8b578}section{background:#202126;border:1px solid #38393e;border-radius:16px;padding:16px;margin:15px 0}input,select,button,textarea{box-sizing:border-box;font:inherit;padding:12px;border-radius:9px;border:1px solid #555;background:#292a30;color:white;max-width:100%}input,select,textarea{width:100%;margin:5px 0 12px}button{cursor:pointer;margin:4px;background:#d8b578;color:#17130c;font-weight:bold}label{font-size:13px;color:#bbb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}table{width:100%;border-collapse:collapse}td,th{padding:9px 4px;border-bottom:1px solid #555;text-align:left}small{color:#bbb}@media print{body{background:white;color:black}body>*{display:none!important}#proposal{display:block!important;background:white;color:black;border:0}#proposal h1,#proposal strong{color:black}}</style><h1>ELOGIO CRESCENTE <small>PRO</small></h1><section><label>Email da direção</label><input id="email" type="email"><label>Palavra-passe</label><input id="password" type="password"><button onclick="login()">Entrar</button><button onclick="logout()">Sair</button><span id="status">Modo local</span></section><section><button onclick="fresh()">Novo</button><button onclick="save()">Guardar</button><button onclick="archive()">Histórico online</button><div id="archive"></div><label>Referência</label><input id="ref"><label>Cliente</label><input id="client"><label>Obra</label><input id="place"><div class="grid"><div><label>Custo equipa/dia (€)</label><input id="daily" type="number" value="600"></div><div><label>Operários da equipa base</label><input id="base" type="number" value="4"></div><div><label>Perdas (%)</label><input id="waste" type="number" value="10"></div><div><label>Margem sobre venda (%)</label><input id="margin" type="number" value="10"></div><div><label>IVA (%)</label><input id="vat" type="number" value="23"></div><div><label>Horas/dia</label><input id="hours" type="number" value="8"></div></div></section><section><h2>Medições</h2><select id="service" onchange="choose()"></select><label>Descrição</label><input id="desc"><div class="grid"><div><label>Quantidade</label><input id="qty" type="number" value="50"></div><div><label>Unidade</label><input id="unit"></div><div><label>Horas-operário/unidade</label><input id="rate" type="number" step="any"></div><div><label>Operários afetos</label><input id="crew" type="number" value="4"></div><div><label>Material €/unidade</label><input id="material" type="number" step="any"></div><div><label>Encargos adicionais €</label><input id="extra" type="number" value="0"></div></div><label>Composição de materiais (nome; unidade; consumo por unidade; preço; embalagem — uma linha por material)</label><textarea id="composition" rows="5"></textarea><small>Se preenchida, a composição substitui o custo agregado de material.</small><p id="preview"></p><button onclick="add()">Adicionar / atualizar artigo</button></section><section><h2>Orçamento</h2><div id="items"></div><h2 id="total"></h2><div id="details"></div><label>Condições comerciais</label><textarea id="notes"></textarea><button onclick="proposal();window.print()">Imprimir / guardar PDF</button><button onclick="backup()">Exportar cópia JSON</button><label>Importar cópia JSON</label><input type="file" accept=".json" onchange="restore(event)"></section><section><h2>Mapa de compras</h2><div id="shopping"></div></section><section id="proposal"></section><small>Catálogo indicativo, não validado integralmente. Confirmar preços, produtividade, IVA e condições técnicas antes de enviar.</small><script>
const $=id=>document.getElementById(id),v=id=>$(id).value,n=id=>Number(v(id)),e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),eur=x=>x.toLocaleString('pt-PT',{style:'currency',currency:'EUR'});const URL='https://jexbbzgcrhpooucqmqyh.supabase.co',KEY='sb_publishable_Ny8d2WTh18wwwhpLy-6rIw_IhhxIsNO';let token='',id=null,items=[],editing=-1;const catalog=[['Pladur divisória normal','m²',.85,17.32,'Placa standard;m²;2;3.6;3\nPerfis;ml;3.2;1.6;3\nLã mineral;m²;1;3.2;1\nJuntas;m²;1;1.8;1'],['Pladur hidrófugo','m²',.9,23],['Pladur perfil ómega','m²',.57,13],['Pladur colado','m²',.5,11],['Teto falso','m²',.7,16],['Tratamento juntas','m²',.2,2.5],['Lã mineral','m²',.2,7],['Capoto EPS 60','m²',1.1,23,'EPS;m²;1;4.5;1\nCola;kg;9;.75;25\nRede;m²;1.1;1.4;50\nBuchas;un;6;.2;100\nAcabamento;m²;1;6.5;1'],['Capoto grafite','m²',1.2,32],['Rede e barramento','m²',.5,8],['Pintura interior','m²',.25,3],['Pintura exterior','m²',.35,4.5],['Primário','m²',.12,1.4],['Gesso fino','m²',.55,3.5],['Lixagem','m²',.15,.6],['Proteção piso','m²',.1,1.2],['Remover telhas','m²',.38,0],['Telha e ripado','m²',.7,23],['Painel sandwich','m²',.5,34],['Estrutura metálica','m²',1.2,42],['Rufos','ml',.8,15],['Caleiras','ml',.7,19],['Demolição','m²',.9,2],['Laje aligeirada','m²',1.6,65],['Betão armado','m³',8,340],['Alvenaria','m²',1,14],['Reboco','m²',.75,5],['Betonilha','m²',.6,9],['Cerâmica','m²',1,25],['Flutuante','m²',.5,19],['Rodapé','ml',.35,5],['Impermeabilização','m²',.5,9],['PVC decorativo','m²',.8,32],['Sanita','un',5,170],['Base duche','un',12,275],['Lavatório','un',6,250],['Canalização','ml',.65,9],['Esgoto','ml',.8,12],['Tomada','un',1.5,18],['Ponto luz','un',2,20],['Ar condicionado','un',12,500],['Porta interior','un',5,190],['Andaimes','m²',.3,3],['Limpeza','m²',.2,.5],['Personalizado','un',1,0]];const fields=['ref','client','place','daily','base','waste','margin','vat','hours','notes'];function choose(){let a=catalog[n('service')];['desc','unit','rate','material','composition'].forEach((k,i)=>$(k).value=a[i]??'');refresh()}function current(){return {desc:v('desc'),unit:v('unit'),qty:n('qty'),rate:n('rate'),crew:n('crew'),material:n('material'),extra:n('extra'),composition:v('composition')}}function parts(a){return a.composition.trim().split('\n').filter(Boolean).map(l=>{let [name,u,q,p,pack]=l.split(';');return{name,u,q:Number(q),p:Number(p),pack:Number(pack)||1}}).filter(m=>m.name&&Number.isFinite(m.q)&&Number.isFinite(m.p)&&m.q>=0&&m.p>=0)}function calc(a){let ps=parts(a),mat=a.qty*(ps.length?ps.reduce((s,m)=>s+m.q*m.p,0):a.material)*(1+Math.max(0,n('waste'))/100),h=a.qty*a.rate,lab=h*n('daily')/Math.max(1,n('base')*n('hours')),cost=mat+lab+a.extra;return{mat,h,lab,cost,sale:cost/(1-Math.min(95,Math.max(0,n('margin')))/100),days:h/Math.max(1,a.crew*n('hours'))}}function totals(){return items.map(calc).reduce((a,b)=>{for(let k in a)a[k]+=b[k];return a},{mat:0,h:0,lab:0,cost:0,sale:0,days:0})}function refresh(){let a=calc(current()),t=totals();$('preview').textContent=`${a.h.toFixed(2)} horas · ${a.days.toFixed(2)} dias · ${eur(a.sale)} sem IVA`;$('items').innerHTML=items.map((a,i)=>`<p>${e(a.desc)} · ${a.qty} ${e(a.unit)} · ${eur(calc(a).sale)} <button onclick="edit(${i})">Editar</button><button onclick="items.splice(${i},1);refresh()">×</button></p>`).join('');$('total').textContent=eur(t.sale*(1+n('vat')/100))+' com IVA';$('details').textContent=`Materiais ${eur(t.mat)} · Equipa ${eur(t.lab)} · Lucro ${eur(t.sale-t.cost)} · ${t.days.toFixed(2)} dias sequenciais`;$('shopping').innerHTML=items.map(a=>`<p><strong>${e(a.desc)}</strong></p>`+parts(a).map(m=>`<p>${e(m.name)}: ${Math.ceil(a.qty*m.q*(1+n('waste')/100)/m.pack)*m.pack} ${e(m.u)}</p>`).join('')).join('');proposal()}function add(){let a=current();if(!a.desc||a.qty<=0||a.crew<1||a.rate<0||a.material<0||a.extra<0)return alert('Verifique os valores');if(editing<0)items.push(a);else items[editing]=a;editing=-1;refresh()}function edit(i){editing=i;Object.entries(items[i]).forEach(([k,x])=>$(k).value=x);refresh();$('desc').scrollIntoView()}function payload(){return{fields:Object.fromEntries(fields.map(k=>[k,v(k)])),items}}function load(p){fields.forEach(k=>{if(p.fields[k]!=null)$(k).value=p.fields[k]});items=p.items;editing=-1;refresh()}function fresh(){id=null;items=[];editing=-1;['client','place','notes'].forEach(k=>$(k).value='');$('ref').value='EC-'+Date.now();refresh()}function proposal(){let t=totals();$('proposal').innerHTML=`<h1>Elogio Crescente Lda</h1><p>NIF 518140784 · Moimenta da Beira</p><h2>Proposta ${e(v('ref'))}</h2><p>Cliente: ${e(v('client'))}<br>Obra: ${e(v('place'))}</p><table><tr><th>Trabalho</th><th>Qtd.</th><th>Valor</th></tr>${items.map(a=>`<tr><td>${e(a.desc)}</td><td>${a.qty} ${e(a.unit)}</td><td>${eur(calc(a).sale)}</td></tr>`).join('')}</table><p>Subtotal: ${eur(t.sale)} · IVA: ${eur(t.sale*n('vat')/100)}</p><h2>Total: ${eur(t.sale*(1+n('vat')/100))}</h2><p>${e(v('notes'))}</p>`}async function api(path,method='GET',body){let r=await fetch(URL+path,{method,headers:{apikey:KEY,...(token?{Authorization:'Bearer '+token}:{}),'Content-Type':'application/json',Prefer:'return=representation'},...(body?{body:JSON.stringify(body)}:{})});let data=await r.json();if(!r.ok)throw Error(data.message||data.msg||'Erro de ligação');return data}async function login(){try{let a=await api('/auth/v1/token?grant_type=password','POST',{email:v('email'),password:v('password')});token=a.access_token;$('password').value='';$('status').textContent='Sessão iniciada';await archive()}catch(x){alert(x.message)}}function logout(){token='';$('status').textContent='Modo local';$('archive').innerHTML=''}async function save(){try{if(!token)return alert('Inicie sessão para guardar online');let a=await api('/rest/v1/ec_quotes'+(id?'?id=eq.'+id:''),id?'PATCH':'POST',{reference:v('ref'),client:v('client'),payload:payload(),updated_at:new Date().toISOString()});if(!a.length)throw Error('Sem permissão de gravação');id=a[0].id;alert('Orçamento guardado')}catch(x){alert(x.message)}}async function archive(){try{if(!token)return alert('Inicie sessão');let a=await api('/rest/v1/ec_quotes?select=*&order=updated_at.desc');$('archive').replaceChildren();a.forEach(x=>{let b=document.createElement('button');b.textContent=x.reference+' · '+x.client;b.onclick=()=>{id=x.id;load(x.payload)};$('archive').append(b)})}catch(x){alert(x.message)}}function backup(){let a=document.createElement('a');a.href=URLcreate(new Blob([JSON.stringify(payload())],{type:'application/json'}));a.download='EC-orcamento.json';a.click()}function URLcreate(b){return window.URL.createObjectURL(b)}async function restore(ev){try{let p=JSON.parse(await ev.target.files[0].text());if(!p.fields||!Array.isArray(p.items))throw Error('Ficheiro inválido');id=null;load(p)}catch(x){alert(x.message)}}$('service').innerHTML=catalog.map((a,i)=>`<option value="${i}">${e(a[0])}</option>`).join('');document.addEventListener('input',refresh);fresh();choose();</script></html>
