<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b0e"><meta name="apple-mobile-web-app-capable" content="yes"><title>Elogio Crescente Digital • Administração</title><style>
:root{--bg:#080a0e;--surface:#13161c;--surface2:#1b1e25;--gold:#e6be69;--gold2:#ae7d35;--line:#393329;--text:#f6f2ec;--muted:#a8a8ad;--green:#5acc99;--red:#f28282;--blue:#80b8ff;--radius:18px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--text);background:radial-gradient(ellipse at 40% -20%,#47301540,transparent 45%),var(--bg);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold)}.wrap{max-width:1250px;margin:auto;padding:0 22px 110px}.header{height:88px;display:flex;justify-content:space-between;align-items:center;gap:18px;border-bottom:1px solid #ffffff14}.brand{display:flex;align-items:center;gap:12px;min-width:0}.mark{height:54px;width:58px;flex:none;filter:drop-shadow(0 0 15px #dcb65a44)}.brand-name{font-size:18px;font-weight:850;letter-spacing:.065em;white-space:nowrap}.brand-sub{font-size:10px;letter-spacing:.21em;color:var(--gold);margin-top:5px}.header-actions{display:flex;align-items:center;gap:10px}.round{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#21232a;border:1px solid #5e4a2b;color:var(--gold);font-size:21px}.avatar{height:42px;width:42px;border-radius:50%;border:2px solid var(--gold);background:#312616;display:grid;place-items:center;font-weight:800;color:var(--gold)}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:28px;margin-top:25px}.sidebar{position:sticky;top:20px;height:max-content}.side-title{color:#8d8271;font-weight:700;text-transform:uppercase;letter-spacing:.18em;font-size:10px;margin:18px 12px}.nav{width:100%;display:flex;align-items:center;gap:12px;text-align:left;color:#b3b2b5;background:transparent;border:1px solid transparent;border-radius:13px;padding:13px 14px;font-weight:650;margin:3px 0}.nav .sym{font-size:20px;width:25px;text-align:center}.nav.active,.nav:hover{color:var(--gold);border-color:#8b6b385b;background:linear-gradient(95deg,#5c421c3d,#14161a)}.side-foot{margin-top:25px;padding:14px;border:1px solid #39302a;border-radius:15px;background:#1b1a19}.side-foot b{color:var(--gold)}.side-foot small{display:block;color:var(--muted);line-height:1.5;margin-top:8px}.main{min-width:0}.welcome{background:linear-gradient(105deg,#17161555,#11151dcc),radial-gradient(ellipse at 82% 5%,#c88f343b,transparent 60%),linear-gradient(145deg,#20232c,#0d1017);border:1px solid #66502e;border-radius:24px;padding:28px;position:relative;overflow:hidden;box-shadow:inset 0 0 50px #efb4510b}.welcome:after{content:"";position:absolute;width:280px;height:280px;border:1px solid #caa05927;transform:rotate(32deg);right:-110px;top:-120px;border-radius:45px;pointer-events:none}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}.welcome h1{font-size:clamp(25px,4vw,38px);margin:11px 0 6px;line-height:1.15}.welcome p{color:#c9c4bc;margin:0 0 20px;max-width:500px}.btn{border:1px solid #78613e;background:#25221c;color:#f1dfba;padding:11px 16px;border-radius:12px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px}.btn.gold{background:linear-gradient(135deg,#ffdf89,#d4a147);color:#21180c;border-color:#f8cd6d;box-shadow:0 5px 23px #dbad4833}.btn.danger{color:#ffb1b1;border-color:#734040}.btn.sm{padding:7px 11px;min-height:34px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.stat{padding:19px;background:linear-gradient(140deg,#27221b,#15171c 70%);border:1px solid #685435;border-radius:17px;box-shadow:inset 0 1px #e3b96c12}.stat i{font-style:normal;font-size:22px;color:var(--gold)}.stat strong{display:block;font-size:27px;margin:5px 0}.stat small{color:#c0b9ad}.sectionline{display:flex;align-items:center;justify-conte px;background:#3a3c41;border-radius:30px;overflow:hidden;margin-top:12px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#a6732c,#ffe18d);border-radius:30px}.projectgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.project{padding:0;border:1px solid #554630;border-radius:20px;background:#181a1e;overflow:hidden}.project-cover{height:120px;background:linear-gradient(0deg,#11151be3,#11151b0a),linear-gradient(130deg,#9f773c,#2f3940 65%,#1c1c20);position:relative;display:flex;align-items:end;padding:14px}.project-cover:before{content:"▥";position:absolute;right:25px;top:5px;font-size:100px;color:#ffffff13}.project-cover b{font-size:19px;position:relative}.project-body{padding:16px}.project-body p{font-size:12px;color:var(--muted);margin:4px 0 10px}.project-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:15px}.money{color:#f5d28c;font-weight:800}.empty{text-align:center;border:1px dashed #665438;border-radius:15px;padding:35px 20px;color:var(--muted)}.empty b{display:block;color:white;margin-bottom:6px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:3px 0 15px}.sectionhead h1{font-size:28px;margin:0 0 5px}.sectionhead p{margin:0;color:var(--muted);font-size:13px}.tablewrap{overflow:auto}.datatable{border-collapse:collapse;width:100%;font-size:13px;min-width:530px}.datatable th{text-align:left;color:var(--gold);font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding:13px 9px;border-bottom:1px solid #59472f}.datatable td{padding:13px 9px;border-bottom:1px solid #343338}.datatable tr:last-child td{border:0}.data-actions{display:flex;gap:6px;flex-wrap:wrap}.mini-btn{border:1px solid #59504a;color:#e6d7be;background:#272627;border-radius:9px;padding:6px 9px;font-size:12px}.modalback{position:fixed;inset:0;background:#000b;z-index:100;display:flex;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(6px)}.modal{background:#16181e;border:1px solid #ad854d;border-radius:21px;width:min(620px,100%);max-height:92dvh;overflow:auto;padding:23px;box-shadow:0 25px 100px #000}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.modalhead h2{margin:0;font-size:22px}.x{background:#2f2c29;border:1px solid #68543a;border-radius:9px;color:#f9d895;font-size:20px;padding:4px 10px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgroup{display:flex;flex-direction:column;gap:6px;min-width:0}.formgroup.full{grid-column:1/-1}.formgroup label{font-size:12px;color:#d6c29d;font-weight:700}.formgroup input,.formgroup textarea,.formgroup select{width:100%;background:#272930;color:white;border:1px solid #55514b;border-radius:10px;padding:12px;outline:0}.formgroup textarea{min-height:80px;resize:vertical}.modalactions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}.notice{padding:14px;border:1px solid #806136;background:#2c251a;border-radius:12px;color:#f4dba9;line-height:1.5;font-size:13px}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);z-index:200;background:#303425;border:1px solid #bb9f57;color:white;border-radius:12px;padding:14px 19px;box-shadow:0 15px 50px #0009;max-width:92vw}.bottom{display:none}.detailtabs{display:flex;gap:7px;overflow:auto;margin:16px 0;scrollbar-width:none}.detailtabs button{white-space:nowrap}.photogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.photogrid img{width:100%;aspect-ratio:1.2;object-fit:cover;border-radius:12px;border:1px solid #584b38}.daylist{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:78px;background:#202228;border:1px solid #34363b;border-radius:10px;padding:9px 5px;text-align:center;cursor:pointer;color:white}.day.selected{border-color:var(--gold);background:#574225}.day small{display:block;color:var(--muted)}.day b{display:block;margin:8px auto}.dashitem{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #3b3938;padding:11px 0}.dashitem:last-child{border:0}.dashitem span{color:var(--muted)}.huge{font-size:29px;font-weight:850;color:var(--gold)}.chartbars{height:125px;display:flex;align-items:flex-end;gap:11px;padding:10px 0 22px}.chartbar{flex:1;background:linear-gradient(#efd07d,#956723);border-radius:5px 5px 0 0;position:relative;min-height:3px}.chartbar small{position:absolute;bottom:-21px;width:100%;text-align:center;font-size:9px;color:#bbb}.printonly{display:none}.mobilemenu{display:none}@media(max-width:850px){.wrap{padding:0 13px 95px}.layout{display:block;margin-top:15px}.sidebar{display:none}.header{height:73px}.brand-name{font-size:13px}.brand-sub{font-size:8px}.mark{width:45px;height:44px}.header-actions .round{width:36px;height:36px}.welcome{padding:22px}.tilegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:140px}.stats{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;background:#101217ed;backdrop-filter:blur(13px);border-top:1px solid #7d6237;z-index:30;justify-content:space-around;padding:8px 4px max(8px,env(safe-area-inset-bottom))}.bottom button{flex:1;max-width:95px;background:none;color:#aaa;border:0;font-size:10px;display:flex;align-items:center;flex-direction:column;gap:5px}.bottom button.active{color:var(--gold)}.bottom button span{font-size:22px}.mobilemenu{display:block}.projectgrid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.formgroup.full{grid-column:auto}.photogrid{grid-template-columns:repeat(2,1fr)}.day{min-height:65px;padding:7px 2px}}@media(min-width:851px){.mobilemenu{display:none!important}}@media print{body{background:#fff;color:#000}.header,.sidebar,.bottom,.noprint,.actions,.btn{display:none!important}.wrap{padding:0}.layout{display:block}.panel,.rowcard{background:white;color:black;border-color:#bbb}.printonly{display:block}}
</style></head><body><div id="app"></div><div id="overlay"></div><div id="notify"></div><script>
'use strict';
const STORAGE='elogio-crescente-direcao-sem-financas-v2';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=x=>x?new Date(x+'T12:00:00').toLocaleDateString('pt-PT'):'—';
const statuses=['Pendente','Em execução','Concluído','Suspenso'];
const seed=()=>({projects:[{id:'adorigo',name:'Adorigo — Moradia José',location:'Adorigo',status:'Em execução'},{id:'beira',name:'Beira-Valente — Sr. Miguel',location:'Beira-Valente',status:'Em execução'},{id:'granjal',name:'Granjal — Cristiano',location:'Granjal',status:'Em execução'},{id:'sarzedo',name:'Sarzedo — Telhado',location:'Sarzedo',status:'Pendente'}],team:[{id:'carlos',name:'Sr. Carlos'},{id:'pedro',name:'Pedro'},{id:'luiz',name:'Luiz'}],tasks:[],materials:[],photos:[]});
let state;try{state=JSON.parse(localStorage.getItem(STORAGE))||seed()}catch(e){state=seed()}
if(!state||typeof state!=='object')state=seed();for(const k of ['projects','team','tasks','materials','photos'])if(!Array.isArray(state[k]))state[k]=seed()[k];
let view='home',activeProject='',filter='';
const project=id=>state.projects.find(x=>x.id===id);
const member=id=>state.team.find(x=>x.id===id);
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state));return true}catch(e){alert('Espaço insuficiente. Remove fotografias antigas ou faz cópia dos registos.');return false}};
function toast(x){const n=document.getElementById('notify');n.innerHTML=`<div class="toast">${esc(x)}</div>`;setTimeout(()=>n.innerHTML='',2800)}
const tag=s=>`<span class="tag ${s==='Concluído'||s==='Entregue'?'green':s==='Em execução'?'blue':''}">${esc(s||'Pendente')}</span>`;
const row=(title,sub,right,actions='')=>`<div class="rowcard"><div class="left"><strong>${title}</strong><small>${sub}</small></div><div class="right">${right}<div class="data-actions" style="justify-content:end;margin-top:8px">${actions}</div></div></div>`;
const empty=t=>`<div class="empty"><b>${esc(t)}</b></div>`;
function go(v,id=''){view=v;activeProject=id;filter='';render();window.scrollTo(0,0)}
const menus=[['home','Início','⌂'],['projects','Obras','⚒'],['tasks','Tarefas','☑'],['materials','Materiais','⬡'],['photos','Fotografias','▣']];
function shell(content){return `<div class="wrap"><header class="header"><div class="brand"><svg class="mark" viewBox="0 0 70 66" fill="none"><path d="M6 57L35 22L65 57H54L35 35L17 57H6Z" fill="#F4D17B"/><path d="M23 23L35 7L47 23V34L35 20L23 34V23Z" fill="#C99336"/><path d="M31 46H39V54H31V46Z" fill="#F7D88E"/><path d="M17 35V16L26 9V26L17 35ZM49 15L57 21V42L49 34V15Z" fill="#E0AC52"/></svg><div><div class="brand-name">ELOGIO CRESCENTE <span style="color:var(--gold);font-size:.6em">LDA</span></div><div class="brand-sub">DIREÇÃO · GESTÃO DE OBRAS</div></div></div><div class="header-actions"><button class="round" onclick="openForm('task')" aria-label="Nova tarefa">＋</button><span class="avatar">EC</span></div></header><div class="layout"><aside class="sidebar"><div class="side-title">Gestão operacional</div>${menus.map(([v,n,i])=>`<button class="nav ${view===v?'active':''}" onclick="go('${v}')"><span class="sym">${i}</span>${n}</button>`).join('')}<div class="side-foot"><b>◆ Direção · V2</b><small>Aplicação exclusivamente operacional. Dados guardados apenas neste dispositivo, sem sincronização.</small></div></aside><main class="main">${content}</main></div></div><nav class="bottom">${menus.map(([v,n,i])=>`<button class="${view===v?'active':''}" onclick="go('${v}')"><span>${i}</span>${n}</button>`).join('')}</nav>`}
function home(){let tasks=state.tasks.filter(x=>x.status!=='Concluído').length,orders=state.materials.filter(x=>x.status==='Pendente').length;return `<div class="welcome"><div class="eyebrow">◆ Direção operacional · ${dt(today())}</div><h1>Bom trabalho, direção.</h1><p>Obras, trabalhos a realizar, pedidos de material e registos fotográficos, tudo no mesmo lugar.</p><div class="actions"><button class="btn gold" onclick="openForm('task')">＋ Nova tarefa</button><button class="btn" onclick="openForm('material')">⬡ Pedir material</button></div></div><div class="stats"><div class="stat"><i>⚒</i><strong>${state.projects.length}</strong><small>Obras</small></div><div class="stat"><i>☑</i><strong>${tasks}</strong><small>Tarefas pendentes</small></div><div class="stat"><i>⬡</i><strong>${orders}</strong><small>Pedidos pendentes</small></div><div class="stat"><i>▣</i><strong>${state.photos.length}</strong><small>Fotografias</small></div></div><div class="sectionline"><h2>Áreas de trabalho</h2></div><div class="tilegrid">${menus.slice(1).map(([v,n,i])=>`<button class="tile" onclick="go('${v}')"><span class="ti">${i}</span><strong>${n}</strong><small>Consultar e atualizar</small></button>`).join('')}</div><div class="notice" style="margin-top:18px">Os dados ficam neste navegador. Para partilha entre dispositivos será necessária uma base de dados com autenticação e permissões.</div>`}
const heading=(t,desc,k,action)=>`<div class="sectionhead"><div><h1>${t}</h1><p>${desc}</p></div>${k?`<button class="btn gold" onclick="${action}">＋ ${k}</button>`:''}</div>`;
function projects(){return heading('Obras','Localização e trabalhos em curso')+`<div class="projectgrid">${state.projects.map(p=>`<article class="project"><div class="project-cover"><b>${esc(p.name)}</b></div><div class="project-body"><p>⌖ ${esc(p.location)}</p><div class="project-footer">${tag(p.status)}<button class="btn sm" onclick="go('detail','${esc(p.id)}')">Abrir obra →</button></div></div></article>`).join('')}</div>`}
function detail(){let p=project(activeProject);if(!p)return projects();return heading(esc(p.name),`⌖ ${esc(p.location)}`)+`<div class="panel"><div class="actions">${tag(p.status)}<button class="btn sm" onclick="openForm('task','${esc(p.id)}')">＋ Tarefa</button><button class="btn sm" onclick="openForm('material','${esc(p.id)}')">＋ Material</button><button class="btn sm" onclick="openPhoto('${esc(p.id)}')">＋ Foto</button></div></div><div class="panel"><h3>Tarefas</h3>${taskRows(state.tasks.filter(t=>t.projectId===p.id))}</div><div class="panel"><h3>Materiais</h3>${materialRows(state.materials.filter(t=>t.projectId===p.id))}</div><div class="panel"><h3>Fotografias</h3>${photoRows(state.photos.filter(t=>t.projectId===p.id))}</div>`}
function taskRows(items){return items.length?items.map(t=>row(esc(t.title),`${esc(project(t.projectId)?.name||'Sem obra')} · ${esc(member(t.assignee)?.name||'Equipa')} · ${dt(t.due)} · ${esc(t.details||'')}`,tag(t.status),`<button class="mini-btn" onclick="toggleTask('${t.id}')">${t.status==='Concluído'?'Reabrir':'Concluir'}</button>`)).join(''):empty('Sem tarefas')}
function tasks(){return heading('Tarefas','Trabalhos a realizar','Nova tarefa',"openForm('task')")+`<div class="panel">${taskRows(state.tasks)}</div>`}
function materialRows(items){return items.length?items.map(m=>row(`${esc(m.item)} · ${esc(m.qty)} ${esc(m.unit)}`,`${esc(project(m.projectId)?.name||'Sem obra')} · ${dt(m.date)} · ${esc(m.requester||'')}`,tag(m.status),`<button class="mini-btn" onclick="setDelivered('${m.id}')">Marcar entregue</button>`)).join(''):empty('Sem pedidos')}
function materials(){return heading('Materiais','Pedidos e entregas','Novo pedido',"openForm('material')")+`<div class="panel">${materialRows(state.materials)}</div>`}
function photoRows(items){return items.length?`<div class="photogrid">${items.map(p=>`<div><img alt="Obra" src="${p.data}"><small class="muted">${esc(project(p.projectId)?.name||'')} · ${dt(p.date)}</small><button class="mini-btn" onclick="deletePhoto('${p.id}')">Apagar</button></div>`).join('')}</div>`:empty('Sem fotografias')}
function photos(){return heading('Fotografias','Registos de obra','Adicionar foto',"openPhoto('')")+`<div class="panel">${photoRows(state.photos)}</div>`}
function toggleTask(id){let x=state.tasks.find(t=>t.id===id);if(x){x.status=x.status==='Concluído'?'Pendente':'Concluído';save();render();toast('Tarefa atualizada')}}
function setDelivered(id){let x=state.materials.find(t=>t.id===id);if(x){x.status='Entregue';save();render();toast('Material entregue')}}
const options=(arr,v,blank)=>`<option value="">${blank}</option>`+arr.map(x=>`<option value="${esc(x.id)}" ${x.id===v?'selected':''}>${esc(x.name)}</option>`).join('');
function openForm(type,pid=''){let isTask=type==='task';document.getElementById('overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${isTask?'Nova tarefa':'Pedido de material'}</h2><button class="x" onclick="closeModal()">×</button></div><form id="form" onsubmit="event.preventDefault();submitForm('${type}')"><div class="formgrid"><div class="formgroup full"><label>${isTask?'Descrição da tarefa':'Material'} *</label><input class="field" name="title" required maxlength="150"></div><div class="formgroup"><label>Obra</label><select class="field" name="projectId">${options(state.projects,pid,'Sem obra')}</select></div>${isTask?`<div class="formgroup"><label>Responsável</label><select class="field" name="assignee">${options(state.team,'','Equipa')}</select></div><div class="formgroup"><label>Prazo</label><input class="field" type="date" name="due" value="${today()}"></div><div class="formgroup full"><label>Instruções</label><textarea class="field" name="details"></textarea></div>`:`<div class="formgroup"><label>Quantidade</label><input class="field" type="number" min="0.01" step="0.01" name="qty" value="1"></div><div class="formgroup"><label>Unidade</label><select class="field" name="unit">${['un','m²','m','kg','sacos','baldes','m³','caixas','rolos'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="formgroup"><label>Solicitado por</label><input class="field" name="requester"></div>`}</div><div class="modalactions"><button class="btn" type="button" onclick="closeModal()">Cancelar</button><button class="btn gold" type="submit">Guardar</button></div></form></div></div>`}
function submitForm(type){let d=Object.fromEntries(new FormData(document.getElementById('form')).entries());if(!d.title?.trim())return; if(type==='task')state.tasks.push({id:uid(),title:d.title,projectId:d.projectId,assignee:d.assignee,due:d.due,details:d.details,status:'Pendente'});else state.materials.push({id:uid(),item:d.title,projectId:d.projectId,qty:Math.max(0,Number(d.qty)||1),unit:d.unit,requester:d.requester,date:today(),status:'Pendente'});if(save()){closeModal();render();toast('Registo guardado')}}
function closeModal(){document.getElementById('overlay').innerHTML=''}
function openPhoto(pid){document.getElementById('overlay').innerHTML=`<div class="modalback"><div class="modal"><div class="modalhead"><h2>Fotografia da obra</h2><button class="x" onclick="closeModal()">×</button></div><div class="formgroup"><label>Obra</label><select id="photo-project" class="field">${options(state.projects,pid,'Sem obra')}</select></div><div class="formgroup" style="margin-top:12px"><label>Fotografia</label><input id="photo-file" class="field" type="file" accept="image/*"></div><div class="modalactions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn gold" onclick="savePhoto()">Guardar</button></div></div></div>`}
function savePhoto(){let f=document.getElementById('photo-file').files[0],pid=document.getElementById('photo-project').value;if(!f)return alert('Escolhe uma fotografia');let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let k=Math.min(1,900/im.width,900/im.height),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);state.photos.push({id:uid(),projectId:pid,date:today(),data:c.toDataURL('image/jpeg',.6)});if(save()){closeModal();render();toast('Fotografia guardada')}};im.onerror=()=>alert('Formato não suportado. Usa JPG.');im.src=r.result};r.readAsDataURL(f)}
function deletePhoto(id){if(!confirm('Apagar fotografia?'))return;state.photos=state.photos.filter(x=>x.id!==id);save();render()}
function render(){try{const content=({home,projects,detail,tasks,materials,photos}[view]||home)();document.getElementById('app').innerHTML=shell(content)}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="wrap"><div class="notice">Não foi possível mostrar esta área. Recarrega a página.</div></div>'}}
render();
</script></body></html>
