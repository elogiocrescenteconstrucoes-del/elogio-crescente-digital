<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#142c51"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Dylan 🚜"><title>A Grande Aventura do Dylan 🚜</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Arial Rounded MT Bold',sans-serif;background:#11264c;color:white}body{display:flex;justify-content:center;align-items:center}#shell{position:relative;width:100%;max-width:520px;height:100%;overflow:hidden;background:#78ccf7}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}button{font:inherit;cursor:pointer;border:0;color:white;font-weight:900;touch-action:manipulation}#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:none;justify-content:space-between;gap:7px;align-items:center;pointer-events:none}.chip{border-radius:30px;background:#142a50df;border:2px solid #ffffff70;padding:8px 11px;font-size:17px;box-shadow:0 4px 0 #0b173558;white-space:nowrap}#pause{pointer-events:auto;background:#fff;color:#12325c;border-radius:50%;width:42px;height:42px;font-size:20px;box-shadow:0 4px 0 #99b7dc}#controls{position:absolute;bottom:max(17px,env(safe-area-inset-bottom));left:0;right:0;display:none;justify-content:space-between;padding:0 20px;pointer-events:none}#controls button{pointer-events:auto;border-radius:24px;width:90px;height:78px;font-size:43px;background:linear-gradient(#ffdf54,#ff9e18);box-shadow:0 6px 0 #bf6113,0 6px 19px #0005;text-shadow:0 2px 0 #bd7e21;border:3px solid #fff9}#controls button:active{transform:translateY(4px);box-shadow:0 2px 0 #bf6113}#panel{position:absolute;inset:0;background:linear-gradient(#0c3168c9,#16315ca6);display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:16px 12px calc(16px + env(safe-area-inset-bottom))}#card{width:min(100%,420px);background:linear-gradient(160deg,#fffdf4,#e3f7ff);color:#15305a;border:5px solid white;border-radius:32px;box-shadow:0 14px 0 #0b2852,0 24px 50px #0007;padding:18px 14px 22px;text-align:center}h1{font-size:clamp(27px,6.7vw,38px);line-height:1.04;margin:4px 0 7px;color:#f46b15;text-shadow:2px 3px 0 #ffdb5d}h2{margin:0 0 8px;font-size:26px}.subtitle{font-size:16px;line-height:1.35;font-weight:750;margin:6px 0 15px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 14px}.vehicle{padding:9px 3px 8px;background:#e2edff;color:#19335a;border:3px solid #aec6e8;border-radius:17px;min-width:0;box-shadow:0 3px 0 #8faac8}.vehicle.active{background:#fff3bf;border-color:#ffad22;box-shadow:0 4px 0 #c97817;transform:translateY(-2px)}.vehicle .emoji{display:block;font-size:39px;margin-bottom:4px}.vehicle .name{display:block;font-size:12px;letter-spacing:-.4px}.primary{width:100%;background:linear-gradient(#6edb62,#199b4c);border:3px solid #f4fff0;border-radius:20px;padding:15px 8px;font-size:23px;box-shadow:0 6px 0 #14783f;margin:5px 0 8px}.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #14783f}.hint{color:#56708b;font-size:13px;font-weight:650}.hidden{display:none!important}#toast{position:absolute;left:50%;top:20%;transform:translate(-50%,-20%);padding:12px 20px;background:#fffbe4;color:#d45416;border:3px solid white;border-radius:25px;white-space:nowrap;font-size:24px;font-weight:1000;pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:0 7px 20px #0004}#toast.show{opacity:1}#smallActions{margin-top:9px;display:flex;justify-content:center;gap:8px}#smallActions button{border-radius:12px;background:#dceafa;color:#23436b;padding:9px 13px;font-size:14px}#badge{font-size:48px;margin:5px 0} @media(max-height:650px){#card{padding:9px 12px 13px}h1{font-size:29px}.vehicle .emoji{font-size:30px}.subtitle{margin:4px 0 8px}.choices{margin:5px 0 8px}.primary{padding:10px}} </style></head>
<body><div id="shell"><canvas id="game"></canvas><div id="hud"><span class="chip" id="stars">⭐ 0</span><span class="chip" id="hearts">❤️❤️❤️</span><span class="chip" id="clock">⏱️ 60</span><button id="pause" aria-label="Pausa">Ⅱ</button></div><div id="controls"><button id="left" aria-label="Virar à esquerda">⬅️</button><button id="right" aria-label="Virar à direita">➡️</button></div><div id="toast"></div><div id="panel"><section id="card"><div id="badge">🚜🚗🏗️</div><h1 id="heading">A GRANDE AVENTURA DO DYLAN!</h1><p id="message" class="subtitle">Conduz, apanha as ⭐ estrelas e desvia-te dos 🚧 obstáculos!</p><div id="selector"><strong>Escolhe a tua máquina:</strong><div class="choices"><button class="vehicle active" data-vehicle="car"><span class="emoji">🏎️</span><span class="name">Carro veloz</span></button><button class="vehicle" data-vehicle="tractor"><span class="emoji">🚜</span><span class="name">Trator forte</span></button><button class="vehicle" data-vehicle="digger"><span class="emoji">🏗️</span><span class="name">Retroescavadora</span></button></div></div><button id="start" class="primary">▶️ VAMOS JOGAR!</button><div class="hint" id="record">🏆 Recorde: 0 estrelas</div><div id="smallActions"><button id="sound">🔊 Som ligado</button></div><p class="hint">Usa as setas ou desliza o dedo para mudar de faixa.<br>Sem anúncios · Sem compras · Feito para o Dylan 💛</p></section></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=390,H=720,dpr=1,roadLeft=65,roadWidth=260,laneWidth=86.67,chosen='car',game='menu',score=0,hearts=3,seconds=60,elapsed=0,scroll=0,items=[],particles=[],spawn=0,playerLane=1,playerX=195,speed=230,last=0,invincible=0,soundOn=true,toastT=0,audio=null,streak=0;
const $=x=>document.getElementById(x);let best=0;try{best=Number(localStorage.getItem('dylan_adventure_record')||0)}catch(e){}$('record').textContent='🏆 Recorde: '+best+' estrelas';
function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);roadWidth=Math.min(W*.73,360);roadLeft=(W-roadWidth)/2;laneWidth=roadWidth/3;playerX=roadLeft+laneWidth*(playerLane+.5)}window.addEventListener('resize',resize);resize();
function rand(a,b){return a+Math.random()*(b-a)}function tone(freq,duration=.11,type='sine',gain=.055){if(!soundOn)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function cheer(){tone(600,.08);setTimeout(()=>tone(820,.13),75)}function updateHUD(){$('stars').textContent='⭐ '+score;$('hearts').textContent='❤️'.repeat(hearts)||'💔';$('clock').textContent='⏱️ '+Math.ceil(seconds)}function notify(t){$('toast').textContent=t;$('toast').classList.add('show');toastT=1.1}
function reset(){game='playing';score=0;hearts=3;seconds=60;elapsed=0;scroll=0;items=[];particles=[];spawn=.6;playerLane=1;playerX=roadLeft+laneWidth*1.5;invincible=0;streak=0;speed=235;$('panel').classList.add('hidden');$('hud').style.display='flex';$('controls').style.display='flex';$('pause').textContent='Ⅱ';updateHUD();tone(400,.12)}
function finish(){game='over';$('start').onclick=reset;$('panel').classList.remove('hidden');$('controls').style.display='none';$('hud').style.display='none';if(score>best){best=score;try{localStorage.setItem('dylan_adventure_record',best)}catch(e){}}$('record').textContent='🏆 Recorde: '+best+' estrelas';$('badge').textContent=score>=20?'🏆🎉🏆':score>=10?'🎉🚜⭐':'💛🚗⭐';$('heading').textContent=score>=20?'CAMPEÃO DYLAN!':'BOA, DYLAN!';$('message').textContent='Apanhaste '+score+' estrelas! '+(score>=20?'És um condutor incrível!':'Vamos tentar bater o recorde?');$('start').textContent='🔄 JOGAR OUTRA VEZ';$('selector').classList.remove('hidden');tone(550,.17);setTimeout(()=>tone(780,.22),170)}
function change(dir){if(game!=='playing')return;const target=Math.max(0,Math.min(2,playerLane+dir));if(target!==playerLane){playerLane=target;tone(270,.06,'triangle',.025)}}
$('left').addEventListener('pointerdown',e=>{e.preventDefault();change(-1)});$('right').addEventListener('pointerdown',e=>{e.preventDefault();change(1)});let touchX=null;canvas.addEventListener('pointerdown',e=>{touchX=e.clientX});canvas.addEventListener('pointerup',e=>{if(touchX===null)return;const dx=e.clientX-touchX;if(Math.abs(dx)>25)change(dx>0?1:-1);else if(game==='playing')change(e.clientX<innerWidth/2?-1:1);touchX=null});document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')change(-1);if(e.key==='ArrowRight'||e.key==='d')change(1);if(e.key===' '&&game==='playing')pause()});
document.querySelectorAll('.vehicle').forEach(b=>b.onclick=()=>{chosen=b.dataset.vehicle;document.querySelectorAll('.vehicle').forEach(v=>v.classList.toggle('active',v===b));tone(490,.07)});$('start').onclick=reset;$('pause').onclick=pause;function pause(){if(game==='playing'){game='paused';$('panel').classList.remove('hidden');$('heading').textContent='PAUSA, DYLAN!';$('badge').textContent='🚜💛🚗';$('message').textContent='As máquinas estão a descansar um bocadinho.';$('selector').classList.add('hidden');$('start').textContent='▶️ CONTINUAR';$('start').onclick=()=>{game='playing';$('panel').classList.add('hidden');$('start').onclick=reset};$('controls').style.display='none'}else if(game==='paused'){game='playing';$('panel').classList.add('hidden');$('controls').style.display='flex'}}$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Som ligado':'🔇 Som desligado';tone(580,.08)};
function spawnItem(){const lane=Math.floor(rand(0,3));const obstacle=Math.random()<.27;items.push({lane,y:-80,kind:obstacle?(Math.random()<.5?'cone':'rock'):'star',spin:rand(0,6),passed:false});if(Math.random()<.3&&!obstacle)items.push({lane:(lane+1+Math.floor(Math.random()*2))%3,y:-130,kind:'star',spin:rand(0,6),passed:false})}
function burst(x,y,color){for(let k=0;k<12;k++)particles.push({x,y,vx:rand(-150,150),vy:rand(-180,80),life:rand(.3,.75),color,r:rand(2,5)})}
function update(dt){if(game!=='playing')return;elapsed+=dt;seconds=Math.max(0,60-elapsed);if(seconds<=0){finish();return}scroll=(scroll+dt*speed)%95;speed=Math.min(345,235+elapsed*1.4);spawn-=dt;if(spawn<=0){spawnItem();spawn=rand(.63,.95)*(240/speed)}const target=roadLeft+laneWidth*(playerLane+.5);playerX+=(target-playerX)*Math.min(1,dt*14);invincible=Math.max(0,invincible-dt);const py=H-Math.max(155,H*.22);for(const it of items){it.y+=speed*dt;it.spin+=dt*3;if(!it.passed&&Math.abs(it.y-py)<48&&Math.abs(roadLeft+laneWidth*(it.lane+.5)-playerX)<laneWidth*.33){it.passed=true;if(it.kind==='star'){score++;streak++;burst(playerX,py-30,'#ffe354');cheer();if(score%10===0)notify('🎉 '+score+' ESTRELAS!')}else if(invincible<=0){hearts--;streak=0;invincible=1.7;burst(playerX,py,'#ff6f52');tone(140,.24,'sawtooth',.065);notify('CUIDADO, DYLAN!');if(hearts<=0){updateHUD();finish();return}}} }items=items.filter(i=>i.y<H+80&&!i.passed);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=350*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').classList.remove('show')}updateHUD()}
function round(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function circle(x,y,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function scenery(){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#8bdafa');sky.addColorStop(1,'#70ce76');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);const size=100;for(let y=((scroll*.65)%size)-size;y<H+size;y+=size){for(const side of [0,1]){let x=side===0?roadLeft*.42:roadLeft+roadWidth+(W-roadLeft-roadWidth)*.56;circle(x,y,Math.min(23,roadLeft*.31),'#409c47');circle(x-7,y-8,Math.min(19,roadLeft*.26),'#60bc53');circle(x+6,y-15,Math.min(16,roadLeft*.24),'#73d265');round(x-3,y+11,6,20,2,'#7e5c2f')}}round(roadLeft-7,0,roadWidth+14,H,0,'#f3d58b');round(roadLeft,0,roadWidth,H,0,'#464c61');round(roadLeft+6,0,3,H,0,'#ffd24d');round(roadLeft+roadWidth-9,0,3,H,0,'#ffd24d');for(let lane=1;lane<3;lane++){let x=roadLeft+laneWidth*lane;for(let y=scroll-95;y<H;y+=95)round(x-2,y,4,48,2,'#e9ebec')}}
function drawStar(x,y,r,rotation){ctx.save();ctx.translate(x,y);ctx.rotate(rotation*.2);ctx.beginPath();for(let j=0;j<10;j++){const a=-Math.PI/2+j*Math.PI/5,rr=j%2?r*.53:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fillStyle='#ffd72d';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff8b4';ctx.stroke();circle(-r*.18,-r*.1,2.5,'#855513');circle(r*.18,-r*.1,2.5,'#855513');ctx.strokeStyle='#855513';ctx.lineWidth=1.7;ctx.beginPath();ctx.arc(0,r*.08,r*.2,0,Math.PI);ctx.stroke();ctx.restore()}
function cone(x,y){ctx.save();ctx.translate(x,y);round(-21,18,42,10,4,'#c96d25');ctx.beginPath();ctx.moveTo(0,-28);ctx.lineTo(20,18);ctx.lineTo(-20,18);ctx.closePath();ctx.fillStyle='#ff8a23';ctx.fill();ctx.lineWidth=7;ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(9,0);ctx.stroke();ctx.restore()}
function rock(x,y){ctx.save();ctx.translate(x,y);ctx.beginPath();ctx.moveTo(-29,21);ctx.lineTo(-24,-12);ctx.lineTo(-7,-28);ctx.lineTo(18,-23);ctx.lineTo(29,-2);ctx.lineTo(20,23);ctx.closePath();ctx.fillStyle='#8f98a2';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#65707a';ctx.stroke();ctx.beginPath();ctx.moveTo(-24,-12);ctx.lineTo(0,2);ctx.lineTo(18,-23);ctx.moveTo(0,2);ctx.lineTo(20,23);ctx.stroke();ctx.restore()}
function vehicle(x,y,kind,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);const scale=Math.min(1.12,laneWidth/90);ctx.scale(scale,scale);ctx.fillStyle='#202335';ctx.beginPath();ctx.ellipse(4,16,33,54,0,0,Math.PI*2);ctx.fill();const col=kind==='car'?'#f33d43':kind==='tractor'?'#4dd255':'#ffbd29';const dark=kind==='car'?'#b92034':kind==='tractor'?'#24953c':'#d28b20';round(-33,-37,15,27,5,'#171b29');round(18,-37,15,27,5,'#171b29');round(-33,17,15,29,5,'#171b29');round(18,17,15,29,5,'#171b29');if(kind==='digger'){round(-30,-45,60,87,9,col);round(-19,-21,38,32,5,'#5091c8');round(17,-55,12,62,5,'#d99118');round(25,-68,11,34,5,'#f4a526');ctx.fillStyle='#76633b';ctx.beginPath();ctx.moveTo(24,-71);ctx.lineTo(44,-71);ctx.lineTo(38,-51);ctx.lineTo(25,-51);ctx.fill();round(-24,18,48,16,4,dark)}else if(kind==='tractor'){round(-27,-48,54,94,10,col);round(-24,-28,48,45,7,'#3188ba');round(-20,20,40,23,5,dark);round(-16,-52,32,15,5,'#83ee71');round(-24,30,48,8,3,'#ffde54');round(24,-18,7,22,3,'#333840')}else{round(-29,-49,58,98,14,col);round(-23,-20,46,40,8,'#89d7ff');round(-21,-43,42,18,6,dark);round(-24,23,48,17,6,dark);round(-23,-49,14,7,3,'#fff6b1');round(9,-49,14,7,3,'#fff6b1');round(-23,39,14,6,2,'#ffb355');round(9,39,14,6,2,'#ffb355')}ctx.restore()}
function draw(){scenery();for(const it of items){const x=roadLeft+laneWidth*(it.lane+.5);if(it.kind==='star')drawStar(x,it.y,24+Math.sin(it.spin)*2,it.spin);else if(it.kind==='cone')cone(x,it.y);else rock(x,it.y)}const py=H-Math.max(155,H*.22);if(game==='playing'||game==='paused')vehicle(playerX,py,chosen,invincible>0&&Math.floor(invincible*10)%2===0?.35:1);for(const p of particles)circle(p.x,p.y,p.r,p.color);if(game==='menu'||game==='over'){vehicle(roadLeft+laneWidth*.5,H*.65,'tractor');vehicle(roadLeft+laneWidth*1.5,H*.7,'car');vehicle(roadLeft+laneWidth*2.5,H*.64,'digger')}}
function frame(t){if(!last)last=t;const dt=Math.min((t-last)/1000,.04);last=t;if(game==='menu'||game==='over')scroll=(scroll+dt*80)%95;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
