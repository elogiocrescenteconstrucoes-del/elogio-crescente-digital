px;background:#3a3c41;border-radius:30px;overflow:hidden;margin-top:12px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#a6732c,#ffe18d);border-radius:30px}.projectgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.project{padding:0;border:1px solid #554630;border-radius:20px;background:#181a1e;overflow:hidden}.project-cover{height:120px;background:linear-gradient(0deg,#11151be3,#11151b0a),linear-gradient(130deg,#9f773c,#2f3940 65%,#1c1c20);position:relative;display:flex;align-items:end;padding:14px}.project-cover:before{content:"▥";position:absolute;right:25px;top:5px;font-size:100px;color:#ffffff13}.project-cover b{font-size:19px;position:relative}.project-body{padding:16px}.project-body p{font-size:12px;color:var(--muted);margin:4px 0 10px}.project-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:15px}.money{color:#f5d28c;font-weight:800}.empty{text-align:center;border:1px dashed #665438;border-radius:15px;padding:35px 20px;color:var(--muted)}.empty b{display:block;color:white;margin-bottom:6px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:3px 0 15px}.sectionhead h1{font-size:28px;margin:0 0 5px}.sectionhead p{margin:0;color:var(--muted);font-size:13px}.tablewrap{overflow:auto}.datatable{border-collapse:collapse;width:100%;font-size:13px;min-width:530px}.datatable th{text-align:left;color:var(--gold);font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding:13px 9px;border-bottom:1px solid #59472f}.datatable td{padding:13px 9px;border-bottom:1px solid #343338}.datatable tr:last-child td{border:0}.data-actions{display:flex;gap:6px;flex-wrap:wrap}.mini-btn{border:1px solid #59504a;color:#e6d7be;background:#272627;border-radius:9px;padding:6px 9px;font-size:12px}.modalback{position:fixed;inset:0;background:#000b;z-index:100;display:flex;align-items:center;justify-content:center;padding:12px;backdrop-filter:b y:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #3b3938;padding:11px 0}.dashitem:last-child{border:0}.dashitem span{color:var(--muted)}.huge{font-size:29px;font-weight:850;color:var(--gold)}.chartbars{height:125px;display:flex;align-items:flex-end;gap:11px;padding:10px 0 22px}.chartbar{flex:1;background:linear-gradient(#efd07d,#956723);border-radius:5px 5px 0 0;position:relative;min-height:3px}.chartbar small{position:absolute;bottom:-21px;width:100%;text-align:center;font-size:9px;color:#bbb}.printonly{display:none}.mobilemenu{display:none}@media(max-width:850px){.wrap{padding:0 13px 95px}.layout{display:block;margin-top:15px}.sidebar{display:none}.header{height:73px}.brand-name{font-size:13px}.brand-sub{font-size:8px}.mark{width:45px;height:44px}.header-actions .round{width:36px;height:36px}.welcome{padding:22px}.tilegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:140px}.stats{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;background:#101217ed;backdrop-filter:blur(13px);border-top:1px solid #7d6237;z-index:30;justify-content:space-around;padding:8px 4px max(8px,env(safe-area-inset-bottom))}.bottom button{flex:1;max-width:95px;background:none;color:#aaa;border:0;font-size:10px;display:flex;align-items:center;flex-direction:column;gap:5px}.bottom button.active{color:var(--gold)}.bottom button span{font-size:22px}.mobilemenu{display:block}.projectgrid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.formgroup.full{grid-column:auto}.photogrid{grid-template-columns:repeat(2,1fr)}.day{min-height:65px;padding:7px 2px}}@media(min-width:851px){.mobilemenu{display:none!important}}@media print{body{background:#fff;color:#000}.header,.sidebar,.bottom,.noprint,.actions,.btn{display:none!important}.wrap{padding:0}.layout{display:block}.panel,.rowcard{background:white;color:black;border-color:#bbb}.printonly{display:block}}
</style></head><body><div id="app"></div><div id="overlay"></div><div id="notify"></div>
<script>
'use strict';
const STORAGE='elogio-crescente-digital-v4';
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const eur=x=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(x)||0);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=x=>x?new Date(x+'T12:00:00').toLocaleDateString('pt-PT'):'—';
const statuses=['Pendente','Em execução','Concluído','Suspenso'];
const initial=()=>({version:4,projects:[{id:'adorigo',name:'Adorigo — Moradia José',client:'José',location:'Adorigo',budget:14626.5,received:13163.85,status:'Em execução',progress:72,notes:'Valores e progresso iniciais de referência. Confirmar recebimentos antes de usar para contabilidade.'},{id:'beira',name:'Beira-Valente — Sr. Miguel',client:'Miguel Nogueira Valente',location:'Beira-Valente',budget:39000,received:9750,status:'Em execução',progress:68,notes:'Contrato em quatro tranches de 25%. Atualizar o estado real.'},{id:'granjal',name:'Granjal — Cristiano',client:'Cristiano',location:'Granjal',budget:0,received:0,status:'Em execução',progress:35,notes:'Churrasqueira, capoto e trabalhos de garagem.'},{id:'sarzedo',name:'Sarzedo — Telhado',client:'A confirmar',location:'Sarzedo',budget:0,received:0,status:'Pendente',progress:5,notes:'Telha sanduíche, cumeeira, caleiros e acabamentos.'}],team:[{id:'carlos',name:'Sr. Carlos',role:'Encarregado',phone:'',active:true},{id:'pedro',name:'Pedro',role:'Aplicador',phone:'',active:true},{id:'luiz',name:'Luiz',role:'Aplicador',phone:'',active:true},{id:'tiago',name:'Tiago',role:'Administração',phone:'',active:true}],tasks:[{id:uid(),title:'Rede e cola — fachada lateral',projectId:'adorigo',assignee:'carlos',status:'Em execução',due:today(),details:'Verificar remates e alinhamentos.'},{id:uid(),title:'Rústico — coroas e remates',projectId:'adorigo',assignee:'pedro',status:'Pendente',due:today(),details:''},{id:uid(),title:'Confirmar portas',projectId:'beira',assignee:'luiz',status:'Pendente',due:today(),details:''}],materials:[],transactions:[],quotes:[],photos:[],notes:[],attendance:[],settings:{company:'Elogio Crescente Lda',nif:'518140784',phone:'934 492 706',email:'elogiocrescenteconstrucoes@gmail.com'}});
let state;try{state=JSON.parse(localStorage.getItem(STORAGE))||initial()}catch(e){state=initial()}for(const k of Object.keys(initial()))if(!(k in state))state[k]=initial()[k];
let view='home',projectId=null,projectTab='tasks',filter='',monthOffset=0,selectedDay=today();
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state));return true}catch(e){alert('Sem espaço de armazenamento. Exporta uma cópia de segurança e reduz o tamanho das fotografias.');return false}};
const project=id=>state.projects.find(p=>p.id===id);
const member=id=>state.team.find(t=>t.id===id);
const tag=(s)=>`<span class="tag ${s==='Concluído'||s==='Recebido'||s==='Aprovado'?'green':s==='Suspenso'||s==='Rejeitado'||s==='Em atraso'?'red':s==='Em execução'?'blue':''}">${esc(s||'Pendente')}</span>`;
const icon={home:'⌂',projects:'⚒',tasks:'☑',materials:'⬡',photos:'▣',quotes:'▤',finance:'▥',team:'♧',calendar:'▦',reports:'▥',settings:'⚙'};
const menus=[['home','Início'],['projects','Obras'],['tasks','Tarefas'],['materials','Materiais'],['photos','Fotografias'],['quotes','Orçamentos'],['finance','Financeiro'],['team','Equipa'],['calendar','Agenda'],['reports','Relatórios'],['settings','Definições']];
function go(v,id){view=v;projectId=id||null;filter='';render();window.scrollTo(0,0)}
const nav=(v,t)=>`<button class="nav ${view===v?'active':''}" onclick="go('${v}')"><span class="sym">${icon[v]}</span>${t}</button>`;
function shell(content){let navs=menus.map(([v,t])=>nav(v,t)).join('');return `<div class="wrap"><header class="header"><div class="brand"><svg class="mark" viewBox="0 0 70 66" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 57L35 22L65 57H54L35 35L17 57H6Z" fill="#F4D17B"/><path d="M23 23L35 7L47 23V34L35 20L23 34V23Z" fill="#C99336"/><path d="M31 46H39V54H31V46Z" fill="#F7D88E"/><path d="M17 35V16L26 9V26L17 35ZM49 15L57 21V42L49 34V15Z" fill="#E0AC52"/></svg><div><div class="brand-name">ELOGIO CRESCENTE <span style="color:var(--gold);font-size:.6em">LDA</span></div><div class="brand-sub">CONSTRUÇÃO E REABILITAÇÃO</div></div></div><div class="header-actions"><button class="round" aria-label="Nova tarefa" onclick="openForm('task')">＋</button><button class="round" aria-label="Definições" onclick="go('settings')">⚙</button><span class="avatar">TM</span></div></header><div class="layout"><aside class="sidebar"><div class="side-title">Painel de gestão</div>${navs}<div class="side-foot"><b>◆ Versão 4</b><small>Dados guardados neste navegador. Exporta cópias de segurança regularmente. Não existe sincronização online nesta versão.</small></div></aside><main class="main">${content}</main></div></div><nav class="bottom">${[['home','Início'],['projects','Obras'],['tasks','Tarefas'],['materials','Pedidos'],['finance','Gestão']].map(([v,t])=>`<button class="${view===v?'active':''}" onclick="go('${v}')"><span>${icon[v]}</span>${t}</button>`).join('')}</nav>`}
const head=(title,desc,add,kind)=>`<div class="sectionhead"><div><h1>${title}</h1><p>${desc}</p></div>${add?`<button class="btn gold" onclick="openForm('${kind}')">＋ ${add}</button>`:''}</div>`;
const row=(title,sub,right,buttons='')=>`<div class="rowcard"><div class="left"><strong>${title}</strong><small>${sub}</small></div><div class="right">${right}${buttons?`<div class="data-actions" style="justify-content:end;margin-top:8px">${buttons}</div>`:''}</div></div>`;
const search=(place='Pesquisar...')=>`<div class="toolbar"><input id="search" class="field" placeholder="${place}" value="${esc(filter)}" oninput="filter=this.value;updateList()"></div>`;
function home(){let active=state.projects.filter(x=>x.status==='Em execução').length,pending=state.tasks.filter(x=>x.status!=='Concluído').length,orders=state.materials.filter(x=>x.status==='Pendente').length,receivable=state.projects.reduce((s,p)=>s+Math.max(0,(+p.budget||0)-(+p.received||0)),0);
let tiles=[['projects','Obras','Gestão e progresso'],['tasks','Tarefas','Planear e atribuir'],['materials','Materiais','Pedidos e stock'],['photos','Fotografias','Registos de obra'],['quotes','Orçamentos','Criar e imprimir'],['finance','Financeiro','Custos e cobranças'],['team','Equipa','Funcionários e horas'],['calendar','Agenda','Trabalhos e prazos'],['reports','Relatórios','Resultados e análises']];return `<div class="welcome"><div class="eyebrow">◆ Direção executiva · ${dt(today())}</div><h1>Bom trabalho, Tiago.</h1><p>O centro de controlo da Elogio Crescente. Acompanha as obras, organiza a equipa e controla cada euro.</p><div class="actions"><button class="btn gold" onclick="openForm('task')">＋ Nova tarefa</button><button class="btn" onclick="openForm('project')">＋ Nova obra</button><button class="btn" onclick="go('calendar')">▦ Agenda</button></div></div><div class="stats"><div class="stat"><i>⚒</i><strong>${active}</strong><small>Obras em execução</small></div><div class="stat"><i>☑</i><strong>${pending}</strong><small>Tarefas por concluir</small></div><div class="stat"><i>⬡</i><strong>${orders}</strong><small>Pedidos pendentes</small></div><div class="stat"><i>€</i><strong style="font-size:19px">${eur(receivable)}</strong><small>Por receber (estimado)</small></div></div><div class="sectionline"><div><h2>Áreas de gestão</h2><p>Escolhe o que queres controlar</p></div></div><div class="tilegrid">${tiles.map(([v,t,s])=>`<button class="tile" onclick="go('${v}')"><span class="ti">${icon[v]}</span><strong>${t}</strong><small>${s}</small></button>`).join('')}</div><div class="sectionline"><h2>Obras em destaque</h2><button class="btn sm" onclick="go('projects')">Ver todas →</button></div>${state.projects.slice(0,3).map(p=>row(esc(p.name),`${esc(p.location)} · ${esc(p.client)}`,tag(p.status),`<button class="mini-btn" onclick="go('detail','${p.id}')">Abrir →</button>`)).join('')||'<div class="empty">Sem obras registadas</div>'}<div class="notice" style="margin-top:20px">🔒 <b>Importante:</b> esta aplicação funciona localmente. Os valores iniciais são apenas dados de referência e precisam de confirmação. Não uses esta versão como sistema contabilístico ou para guardar dados sensíveis de clientes.</div>`}
function projects(){return head('Obras','Acompanhamento, valores e progresso','Nova obra','project')+search('Pesquisar obra, cliente ou local...')+`<div id="results">${projectCards()}</div>`}
function projectCards(){let q=filter.toLowerCase();let ps=state.projects.filter(p=>[p.name,p.client,p.location,p.status].join(' ').toLowerCase().includes(q));return ps.length?`<div class="projectgrid">${ps.map(p=>`<article class="project"><div class="project-cover"><b>${esc(p.name)}</b></div><div class="project-body"><p>⌖ ${esc(p.location)} · ${esc(p.client)}</p><div style="display:flex;justify-content:space-between;align-items:center">${tag(p.status)}<b>${Math.min(100,Math.max(0,+p.progress||0))}%</b></div><div class="progress"><span style="width:${Math.min(100,Math.max(0,+p.progress||0))}%"></span></div><div class="project-footer"><span class="money">${eur(p.budget)}</span><button class="btn sm" onclick="go('detail','${p.id}')">Gerir obra →</button></div></div></article>`).join('')}</div>`:'<div class="empty"><b>Não foram encontradas obras</b>Cria uma obra ou altera a pesquisa.</div>'}
function detail(){let p=project(projectId);if(!p)return projects();let tabs=[['tasks','Tarefas'],['materials','Materiais'],['photos','Fotografias'],['finance','Movimentos'],['notes','Apontamentos']];let body='';let list=state.tasks.filter(t=>t.projectId===p.id);if(projectTab==='tasks')body=`<div class="actions"><button class="btn gold" onclick="openForm('task',null,'${p.id}')">＋ Nova tarefa</button></div>${list.map(t=>taskRow(t)).join('')||empty('Sem tarefas nesta obra')}`;if(projectTab==='materials')body=`<div class="actions"><button class="btn gold" onclick="openForm('material',null,'${p.id}')">＋ Pedir material</button></div>${state.materials.filter(x=>x.projectId===p.id).map(m=>materialRow(m)).join('')||empty('Ainda não existem pedidos')}`;if(projectTab==='photos')body=photoSection(p.id);if(projectTab==='finance')body=`<div class="actions"><button class="btn gold" onclick="openForm('transaction',null,'${p.id}')">＋ Registar movimento</button></div>${state.transactions.filter(t=>t.projectId===p.id).map(t=>transactionRow(t)).join('')||empty('Sem movimentos registados')}`;if(projectTab==='notes')body=`<div class="actions"><button class="btn gold" onclick="openForm('note',null,'${p.id}')">＋ Novo apontamento</button></div>${state.notes.filter(t=>t.projectId===p.id).map(t=>row(esc(t.title),`${dt(t.date)} · ${esc(t.text)}`,'',`<button class="mini-btn" onclick="removeItem('notes','${t.id}')">Apagar</button>`)).join('')||empty('Sem apontamentos')}`;
return `<div class="sectionhead"><div><button class="btn sm" onclick="go('projects')">← Obras</button><h1 style="margin-top:12px">${esc(p.name)}</h1><p>⌖ ${esc(p.location)} · Cliente: ${esc(p.client)}</p></div><button class="btn" onclick="openForm('project','${p.id}')">✎ Editar obra</button></div><div class="panel"><div class="actions" style="justify-content:space-between"><div>${tag(p.status)}</div><b>${p.progress||0}% concluído</b></div><div class="progress"><span style="width:${p.progress||0}%"></span></div><div class="stats" style="margin-top:17px"><div class="stat"><small>Contrato</small><strong style="font-size:19px">${eur(p.budget)}</strong></div><div class="stat"><small>Recebido (manual)</small><strong style="font-size:19px">${eur(p.received)}</strong></div><div class="stat"><small>Em falta</small><strong style="font-size:19px">${eur((p.budget||0)-(p.received||0))}</strong></div><div class="stat"><small>Despesas registadas</small><strong style="font-size:19px">${eur(state.transactions.filter(x=>x.projectId===p.id&&x.type==='Despesa').reduce((s,t)=>s+Number(t.amount),0))}</strong></div></div><p class="muted mini">${esc(p.notes||'')}</p></div><div class="detailtabs">${tabs.map(([id,n])=>`<button class="btn sm ${projectTab===id?'gold':''}" onclick="projectTab='${id}';render()">${n}</button>`).join('')}</div><div class="panel">${body}</div>`}
const empty=t=>`<div class="empty"><b>${t}</b>Usa o botão acima para adicionar.</div>`;
function taskRow(t){return row(esc(t.title),`${esc(project(t.projectId)?.name||'Sem obra')} · ${esc(member(t.assignee)?.name||'Sem responsável')} · Prazo: ${dt(t.due)}`,tag(t.status),`<button class="mini-btn" onclick="openForm('task','${t.id}')">Editar</button><button class="mini-btn" onclick="setTaskStatus('${t.id}')">${t.status==='Concluído'?'Reabrir':'Concluir'}</button>`)}
function tasks(){return head('Tarefas','Distribuição de trabalho e acompanhamento','Nova tarefa','task')+`<div class="toolbar"><input id="search" class="field" placeholder="Pesquisar tarefa..." value="${esc(filter)}" oninput="filter=this.value;updateList()"><select id="taskstatus" class="field" onchange="updateList()"><option value="">Todos os estados</option>${statuses.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="panel" id="results">${taskList()}</div>`}
function taskList(){let q=filter.toLowerCase(),st=document.getElementById('taskstatus')?.value||'';let ts=state.tasks.filter(t=>(!st||t.status===st)&&[t.title,t.details,project(t.projectId)?.name,member(t.assignee)?.name].join(' ').toLowerCase().includes(q)).sort((a,b)=>(a.due||'').localeCompare(b.due||''));return ts.map(taskRow).join('')||empty('Não existem tarefas com estes filtros')}
function setTaskStatus(id){let t=state.tasks.find(t=>t.id===id);if(t){t.status=t.status==='Concluído'?'Pendente':'Concluído';save();render();toast('Estado da tarefa atualizado')}}
function materialRow(m){return row(`${esc(m.item)} · ${esc(m.qty)} ${esc(m.unit)}`,`${esc(project(m.projectId)?.name||'Sem obra')} · ${dt(m.date)} · ${esc(m.requester||'')}`,tag(m.status),`<button class="mini-btn" onclick="openForm('material','${m.id}')">Editar</button>${m.status==='Pendente'?`<button class="mini-btn" onclick="setMaterial('${m.id}','Aprovado')">Aprovar</button>`:''}`)}
function materials(){return head('Materiais','Pedidos, aprovações e entregas','Novo pedido','material')+search('Pesquisar material...')+`<div class="panel" id="results">${materialList()}</div>`}
function materialList(){let q=filter.toLowerCase();return state.materials.filter(m=>[m.item,m.requester,project(m.projectId)?.name].join(' ').toLowerCase().includes(q)).map(materialRow).join('')||empty('Sem pedidos de materiais')}
function setMaterial(id,s){let m=state.materials.find(x=>x.id===id);if(m){m.status=s;save();render();toast('Pedido atualizado')}}
function photoSection(pid){let ps=state.photos.filter(x=>!pid||x.projectId===pid);return `<div class="actions" style="margin-bottom:15px"><button class="btn gold" onclick="openPhoto('${pid||''}')">▣ Adicionar fotografias</button></div>${ps.length?`<div class="photogrid">${ps.map(p=>`<div><img src="${p.data}" alt="Fotografia da obra"><small class="muted">${esc(project(p.projectId)?.name||'')} · ${dt(p.date)}</small><button class="mini-btn" onclick="removeItem('photos','${p.id}')">Apagar</button></div>`).join('')}</div>`:empty('Sem fotografias guardadas')}`}
function photos(){return head('Fotografias','Registos fotográficos das obras')+`<div class="panel">${photoSection('')}</div>`}
function quotes(){return head('Orçamentos','Propostas comerciais imprimíveis','Novo orçamento','quote')+`<div class="panel">${state.quotes.map(q=>row(esc(q.title),`${esc(q.client)} · ${dt(q.date)} · ${esc(q.description).slice(0,100)}`,`<b class="money">${eur(q.amount)}</b>`, `<button class="mini-btn" onclick="openForm('quote','${q.id}')">Editar</button><button class="mini-btn" onclick="printQuote('${q.id}')">Imprimir / PDF</button>`)).join('')||empty('Ainda não existem orçamentos')}</div>`}
function transactionRow(t){return row(esc(t.description),`${esc(project(t.projectId)?.name||'Geral')} · ${dt(t.date)} · ${esc(t.category)}`,`<b style="color:${t.type==='Despesa'?'var(--red)':'var(--green)'}">${t.type==='Despesa'?'-':'+'}${eur(t.amount)}</b>`,`<button class="mini-btn" onclick="openForm('transaction','${t.id}')">Editar</button>`)}
function finance(){let items=state.transactions,inc=items.filter(x=>x.type==='Receita').reduce((s,x)=>s+Number(x.amount),0),exp=items.filter(x=>x.type==='Despesa').reduce((s,x)=>s+Number(x.amount),0);return head('Financeiro','Movimentos, despesas e cobranças','Novo movimento','transaction')+`<div class="stats" style="margin:15px 0"><div class="stat"><small>Receitas registadas</small><strong style="font-size:19px">${eur(inc)}</strong></div><div class="stat"><small>Despesas registadas</small><strong style="font-size:19px">${eur(exp)}</strong></div><div class="stat"><small>Saldo movimentos</small><strong style="font-size:19px">${eur(inc-exp)}</strong></div><div class="stat"><small>Contratos em aberto</small><strong style="font-size:19px">${eur(state.projects.reduce((s,p)=>s+Math.max(0,Number(p.budget)-Number(p.received)),0))}</strong></div></div><div class="notice" style="margin-bottom:15px">O saldo usa apenas movimentos inseridos aqui; os campos «recebido» das obras não são somados novamente para evitar duplicações. Não substitui contabilidade certificada.</div><div class="panel">${items.length?items.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(transactionRow).join(''):empty('Sem movimentos financeiros registados')}</div>`}
function team(){return head('Equipa','Funcionários, funções e registos de presença','Novo funcionário','member')+`<div class="panel">${state.team.map(m=>row(esc(m.name),`${esc(m.role)} · ${esc(m.phone||'Sem telefone')}`,tag(m.active?'Ativo':'Inativo'),`<button class="mini-btn" onclick="openForm('member','${m.id}')">Editar</button><button class="mini-btn" onclick="openForm('attendance',null,'${m.id}')">Registar horas</button>`)).join('')}</div><div class="sectionline"><h2>Registos de horas</h2></div><div class="panel"><div class="tablewrap"><table class="datatable"><thead><tr><th>Data</th><th>Funcionário</th><th>Tipo</th><th>Horas</th><th>Obra</th><th></th></tr></thead><tbody>${state.attendance.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${dt(x.date)}</td><td>${esc(member(x.memberId)?.name||'')}</td><td>${esc(x.type)}</td><td>${esc(x.hours)}</td><td>${esc(project(x.projectId)?.name||'—')}</td><td><button class="mini-btn" onclick="removeItem('attendance','${x.id}')">Apagar</button></td></tr>`).join('')||'<tr><td colspan="6">Sem registos</td></tr>'}</tbody></table></div></div>`}
function calendar(){let now=new Date();now.setMonth(now.getMonth()+monthOffset);let y=now.getFullYear(),m=now.getMonth();let first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();let cells=Array.from({length:first},()=>'<div></div>').concat(Array.from({length:days},(_,i)=>{let date=`${y}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`,num=state.tasks.filter(t=>t.due===date).length;return `<button class="day ${selectedDay===date?'selected':''}" onclick="selectedDay='${date}';render()"><small>${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'][(first+i)%7]}</small><b>${i+1}</b>${num?`<small style="color:var(--gold)">● ${num}</small>`:''}</button>`}));return head('Agenda','Calendário de tarefas e prazos')+`<div class="panel"><div class="sectionhead"><button class="btn sm" onclick="monthOffset--;render()">←</button><h3>${now.toLocaleDateString('pt-PT',{month:'long',year:'numeric'})}</h3><button class="btn sm" onclick="monthOffset++;render()">→</button></div><div class="daylist">${cells.join('')}</div></div><div class="panel"><h3>Trabalhos em ${dt(selectedDay)}</h3>${state.tasks.filter(t=>t.due===selectedDay).map(taskRow).join('')||empty('Não existem tarefas nesta data')}<div class="actions" style="margin-top:15px"><button class="btn gold" onclick="openForm('task')">＋ Agendar tarefa</button></div></div>`}
function reports(){let proj=state.projects.length,tasks=state.tasks.length,done=state.tasks.filter(t=>t.status==='Concluído').length,exp=state.transactions.filter(x=>x.type==='Despesa').reduce((s,x)=>s+Number(x.amount),0),income=state.transactions.filter(x=>x.type==='Receita').reduce((s,x)=>s+Number(x.amount),0),status=['Pendente','Em execução','Concluído','Suspenso'];let counts=status.map(s=>state.tasks.filter(t=>t.status===s).length);return head('Relatórios','Indicadores e análise operacional')+`<div class="stats"><div class="stat"><small>Obras</small><strong>${proj}</strong></div><div class="stat"><small>Tarefas concluídas</small><strong>${done}/${tasks}</strong></div><div class="stat"><small>Despesas</small><strong style="font-size:19px">${eur(exp)}</strong></div><div class="stat"><small>Receitas</small><strong style="font-size:19px">${eur(income)}</strong></div></div><div class="twocol" style="margin-top:15px"><div class="panel"><h3>Estado das tarefas</h3>${status.map((s,i)=>`<div class="dashitem"><span>${s}</span><strong>${counts[i]}</strong></div>`).join('')}<div class="chartbars">${counts.map((v,i)=>`<div class="chartbar" style="height:${v?Math.max(8,100*v/Math.max(1,...counts)):3}%"><small>${['Pend.','Exec.','Conc.','Susp.'][i]}</small></div>`).join('')}</div></div><div class="panel"><h3>Resumo de negócio</h3><div class="dashitem"><span>Contratos registados</span><b>${eur(state.projects.reduce((s,p)=>s+Number(p.budget),0))}</b></div><div class="dashitem"><span>Recebimentos nas fichas de obra</span><b>${eur(state.projects.reduce((s,p)=>s+Number(p.received),0))}</b></div><div class="dashitem"><span>Pedidos pendentes</span><b>${state.materials.filter(m=>m.status==='Pendente').length}</b></div><div class="dashitem"><span>Horas registadas</span><b>${state.attendance.reduce((s,x)=>s+Number(x.hours||0),0)} h</b></div><button class="btn" onclick="exportCSV()">↓ Exportar movimentos CSV</button></div></div>`}
function settings(){let s=state.settings;return head('Definições','Empresa, cópias de segurança e segurança dos dados')+`<div class="panel"><h3>Dados da empresa</h3><div class="dashitem"><span>Empresa</span><b>${esc(s.company)}</b></div><div class="dashitem"><span>NIF</span><b>${esc(s.nif)}</b></div><div class="dashitem"><span>Telefone</span><b>${esc(s.phone)}</b></div><div class="dashitem"><span>Email</span><b>${esc(s.email)}</b></div><div class="actions" style="margin-top:15px"><button class="btn" onclick="openForm('settings')">Editar dados</button></div></div><div class="panel"><h3>Segurança e exportação</h3><p class="muted">Os dados ficam no armazenamento deste navegador. Se limpares os dados do Safari ou mudares de equipamento, podes perdê-los. Faz backups regulares.</p><div class="actions"><button class="btn gold" onclick="backup()">↓ Exportar cópia JSON</button><button class="btn" onclick="document.getElementById('importfile').click()">↑ Importar cópia</button><input id="importfile" type="file" accept=".json,application/json" hidden onchange="importBackup(this)"></div></div><div class="panel"><h3>Limites desta versão</h3><p class="muted">Sem login de funcionários, permissões por utilizador, sincronização em tempo real ou servidor seguro. O GitHub Pages publica apenas a interface estática. Para usar em vários telemóveis, precisaremos de backend autenticado e base de dados.</p><div class="notice">Não coloques palavras-passe, documentos pessoais, dados bancários ou informação confidencial de clientes neste protótipo publicado.</div></div><div class="panel"><h3>Reinicialização</h3><p class="muted">Apaga os dados locais e regressa aos exemplos iniciais. Faz backup antes.</p><button class="btn danger" onclick="resetAll()">Apagar dados locais</button></div>`}
function updateList(){document.getElementById('results').innerHTML=({projects:projectCards,tasks:taskList,materials:materialList}[view]||(()=>''))()}
function render(){let content;try{content=({home,projects,detail,tasks,materials,photos,quotes,finance,team,calendar,reports,settings}[view]||home)();document.getElementById('app').innerHTML=shell(content)}catch(e){console.error(e);document.getElementById('app').innerHTML=shell(`<div class="notice">Ocorreu um erro ao mostrar esta secção. <button class="btn" onclick="go('home')">Voltar ao início</button></div>`)}}
function toast(t){let el=document.getElementById('notify');el.innerHTML=`<div class="toast">✓ ${esc(t)}</div>`;setTimeout(()=>el.innerHTML='',3000)}
const projOptions=v=>`<option value="">Sem obra</option>`+state.projects.map(x=>`<option value="${x.id}" ${x.id===v?'selected':''}>${esc(x.name)}</option>`).join('');
const teamOptions=v=>`<option value="">Sem responsável</option>`+state.team.map(x=>`<option value="${x.id}" ${x.id===v?'selected':''}>${esc(x.name)}</option>`).join('');
const statusOptions=v=>statuses.map(s=>`<option ${v===s?'selected':''}>${s}</option>`).join('');
const field=(name,label,value='',type='text',full=false,extra='')=>`<div class="formgroup ${full?'full':''}"><label for="f_${name}">${label}</label>${type==='textarea'?`<textarea id="f_${name}" name="${name}">${esc(value)}</textarea>`:type==='select'?`<select id="f_${name}" name="${name}">${extra}</select>`:`<input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'step="0.01" min="0"':''}>`}</div>`;
function openForm(type,id=null,context=''){let cfg={project:['Obra','projects'],task:['Tarefa','tasks'],material:['Pedido de material','materials'],transaction:['Movimento financeiro','transactions'],member:['Funcionário','team'],attendance:['Horas / presença','attendance'],note:['Apontamento','notes'],quote:['Orçamento','quotes'],settings:['Dados da empresa','settings']}[type];if(!cfg)return;let item=id?(state[cfg[1]]||[]).find(x=>x.id===id):null;let x=item||{},f='';
if(type==='project')f=field('name','Nome da obra *',x.name)+field('client','Cliente',x.client)+field('location','Local',x.location)+field('status','Estado',null,'select',false,statusOptions(x.status||'Pendente'))+field('budget','Valor do contrato (€)',x.budget||0,'number')+field('received','Total recebido (€)',x.received||0,'number')+field('progress','Progresso (%)',x.progress||0,'number')+field('notes','Observações',x.notes,'textarea',true);
if(type==='task')f=field('title','Trabalho / tarefa *',x.title,'text',true)+field('projectId','Obra',null,'select',false,projOptions(x.projectId||context))+field('assignee','Responsável',null,'select',false,teamOptions(x.assignee))+field('due','Data prevista',x.due||selectedDay,'date')+field('status','Estado',null,'select',false,statusOptions(x.status||'Pendente'))+field('details','Instruções',x.details,'textarea',true);
if(type==='material')f=field('item','Material *',x.item)+field('qty','Quantidade',x.qty||1,'number')+field('unit','Unidade',null,'select',false,['un','m²','m','kg','sacos','baldes','m³','caixas','rolos'].map(z=>`<option ${z===(x.unit||'un')?'selected':''}>${z}</option>`).join(''))+field('projectId','Obra',null,'select',false,projOptions(x.projectId||context))+field('requester','Solicitado por',x.requester||'')+field('date','Data',x.date||today(),'date')+field('status','Estado',null,'select',false,['Pendente','Aprovado','Encomendado','Entregue','Rejeitado'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join(''))+field('details','Notas',x.details||'','textarea',true);
if(type==='transaction')f=field('description','Descrição *',x.description)+field('amount','Valor (€) *',x.amount||0,'number')+field('type','Tipo',null,'select',false,['Despesa','Receita'].map(s=>`<option ${x.type===s?'selected':''}>${s}</option>`).join(''))+field('category','Categoria',x.category||'Geral')+field('projectId','Obra',null,'select',false,projOptions(x.projectId||context))+field('date','Data',x.date||today(),'date');
if(type==='member')f=field('name','Nome *',x.name)+field('role','Função',x.role)+field('phone','Telefone',x.phone)+field('active','Estado',null,'select',false,`<option value="true" ${x.active!==false?'selected':''}>Ativo</option><option value="false" ${x.active===false?'selected':''}>Inativo</option>`);
if(type==='attendance')f=field('memberId','Funcionário',null,'select',false,teamOptions(x.memberId||context))+field('date','Data',x.date||today(),'date')+field('type','Tipo',null,'select',false,['Presença','Falta','Férias','Horas extra'].map(z=>`<option ${x.type===z?'selected':''}>${z}</option>`).join(''))+field('hours','Horas',x.hours??8,'number')+field('projectId','Obra',null,'select',false,projOptions(x.projectId));
if(type==='note')f=field('title','Assunto *',x.title)+field('date','Data',x.date||today(),'date')+field('projectId','Obra',null,'select',false,projOptions(x.projectId||context))+field('text','Descrição',x.text,'textarea',true);
if(type==='quote')f=field('title','Título da proposta *',x.title)+field('client','Cliente *',x.client)+field('date','Data',x.date||today(),'date')+field('amount','Valor sem IVA (€)',x.amount||0,'number')+field('vat','IVA (%)',x.vat??23,'number')+field('description','Descrição dos trabalhos',x.description,'textarea',true)+field('conditions','Condições de pagamento',x.conditions||'Conforme adjudicação e acordo escrito.','textarea',true);
if(type==='settings')f=field('company','Empresa',state.settings.company)+field('nif','NIF',state.settings.nif)+field('phone','Telefone',state.settings.phone)+field('email','Email',state.settings.email);
document.getElementById('overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h2>${id?'Editar':'Novo'} ${cfg[0].toLowerCase()}</h2><button class="x" onclick="closeModal()">×</button></div><form id="editform" onsubmit="event.preventDefault();submitForm('${type}','${id||''}')"><div class="formgrid">${f}</div><div class="modalactions">${id&&type!=='settings'?`<button type="button" class="btn danger" onclick="removeItem('${cfg[1]}','${id}')">Apagar</button>`:''}<button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn gold" type="submit">Guardar</button></div></form></div></div>`}
function closeModal(){document.getElementById('overlay').innerHTML=''}
function submitForm(type,id){let form=document.getElementById('editform');let data=Object.fromEntries(new FormData(form).entries());let required=({project:'name',task:'title',material:'item',transaction:'description',member:'name',note:'title',quote:'title'})[type];if(required&&!String(data[required]||'').trim()){alert('Preenche o campo obrigatório.');return}let map={project:'projects',task:'tasks',material:'materials',transaction:'transactions',member:'team',attendance:'attendance',note:'notes',quote:'quotes',settings:'settings'};let target=map[type];for(let k of ['budget','received','progress','amount','vat','qty','hours'])if(k in data)data[k]=Math.max(0,Number(data[k])||0);if(type==='project')data.progress=Math.min(100,data.progress);if(type==='member')data.active=data.active==='true';if(type==='settings')state.settings={...state.settings,...data};else{let idx=state[target].findIndex(x=>x.id===id);if(idx>=0)state[target][idx]={...state[target][idx],...data};else state[target].push({id:uid(),...data})}if(save()){closeModal();render();toast('Registo guardado com sucesso')}}
function removeItem(key,id){if(!confirm('Queres mesmo apagar este registo?'))return;state[key]=state[key].filter(x=>x.id!==id);save();closeModal();render();toast('Registo apagado')}
function openPhoto(pid){document.getElementById('overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>Adicionar fotografia</h2><button class="x" onclick="closeModal()">×</button></div><div class="formgrid">${field('projectId','Obra',null,'select',true,projOptions(pid))}<div class="formgroup full"><label>Fotografia (JPG, PNG ou HEIC se suportado)</label><input id="photo-input" type="file" accept="image/*" class="field"></div></div><p class="muted mini">As fotografias são reduzidas para poupar espaço. Não existem backups automáticos.</p><div class="modalactions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn gold" onclick="savePhoto()">Guardar foto</button></div></div></div>`}
function savePhoto(){let file=document.getElementById('photo-input').files[0],pid=document.getElementById('f_projectId').value;if(!file){alert('Escolhe uma fotografia.');return}let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let scale=Math.min(1,1100/im.width,1100/im.height),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);state.photos.push({id:uid(),projectId:pid,date:today(),data:c.toDataURL('image/jpeg',.65)});if(save()){closeModal();render();toast('Fotografia guardada')}};im.onerror=()=>alert('Não foi possível ler este formato de imagem. Usa uma fotografia JPG.');im.src=reader.result};reader.readAsDataURL(file)}
function backup(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`elogio-crescente-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Cópia de segurança preparada')}
function importBackup(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.projects)||!Array.isArray(x.tasks)||!Array.isArray(x.team))throw Error('Estrutura inválida');if(!confirm('Importar vai substituir todos os dados locais. Continuar?'))return;state=x;save();go('home');toast('Cópia importada')}catch(e){alert('Ficheiro inválido: '+e.message)}};r.readAsText(f)}
function resetAll(){if(!confirm('Isto elimina TODOS os registos locais. Tens cópia de segurança?'))return;if(!confirm('Confirmas a eliminação definitiva dos registos neste navegador?'))return;state=initial();save();go('home')}
function exportCSV(){let rows=[['Data','Tipo','Descrição','Categoria','Obra','Valor'],...state.transactions.map(t=>[t.date,t.type,t.description,t.category,project(t.projectId)?.name||'',t.amount])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download=`movimentos-${today()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function printQuote(id){let q=state.quotes.find(z=>z.id===id);if(!q)return;let vat=Number(q.vat)||0,amount=Number(q.amount)||0;let w=window.open('','_blank');if(!w){alert('Permite janelas pop-up para imprimir o orçamento.');return}w.document.write(`<!doctype html><html lang="pt"><head><meta charset="utf-8"><title>Proposta — ${esc(q.title)}</title><style>body{font:15px Arial,sans-serif;padding:45px;color:#222;max-width:800px;margin:auto}header{border-bottom:4px solid #b9904c;padding-bottom:20px}h1{color:#9f742e}aside{background:#f4f0e9;padding:20px;border-radius:10px;white-space:pre-wrap}.sum{text-align:right;margin-top:25px;line-height:2}footer{margin-top:70px;border-top:1px solid #aaa;padding-top:15px;color:#666;font-size:12px}</style></head><body><header><h1>ELOGIO CRESCENTE LDA</h1>Construção e Reabilitação<br>NIF ${esc(state.settings.nif)} · ${esc(state.settings.phone)}<br>${esc(state.settings.email)}</header><h2>Proposta: ${esc(q.title)}</h2><p><b>Cliente:</b> ${esc(q.client)}<br><b>Data:</b> ${dt(q.date)}</p><h3>Descrição dos trabalhos</h3><aside>${esc(q.description||'—')}</aside><div class="sum">Base tributável: <b>${eur(amount)}</b><br>IVA (${vat}%): <b>${eur(amount*vat/100)}</b><br><h2>Total: ${eur(amount*(1+vat/100))}</h2></div><h3>Condições</h3><p>${esc(q.conditions||'')}</p><footer>Documento comercial não fiscal. Sujeito a confirmação e adjudicação.</footer><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
window.addEventListener('error',e=>console.error('EC:',e.message));render();
</script></body></html>
